name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Frontend integration tests
        run: npm test -- --run

      - name: Validate application security configuration
        run: npm run security:check

      - name: Build production frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SIGNUP_API_URL: ${{ vars.VITE_SIGNUP_API_URL }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-rider-frontend-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Django checks, tests, and migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: relay_rider_ci
          POSTGRES_USER: relay_rider_ci
          POSTGRES_PASSWORD: relay_rider_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay_rider_ci -d relay_rider_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://relay_rider_ci:relay_rider_ci@127.0.0.1:5432/relay_rider_ci
      DATABASE_SSL_REQUIRE: "false"
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-for-validation
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: https://app.example.org
      CSRF_TRUSTED_ORIGINS: https://app.example.org
      DJANGO_SECURE_SSL_REDIRECT: "true"
      SESSION_COOKIE_SECURE: "true"
      CSRF_COOKIE_SECURE: "true"
      SECURE_HSTS_SECONDS: "31536000"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
      SECURE_HSTS_PRELOAD: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations to validation database
        run: python manage.py migrate --noinput

      - name: Django system checks
        run: python manage.py check

      - name: Django deployment checks
        run: python manage.py check --deploy

      - name: Django API tests
        run: python manage.py test relay
        env:
          DJANGO_SECURE_SSL_REDIRECT: "false"
          SESSION_COOKIE_SECURE: "false"
          CSRF_COOKIE_SECURE: "false"

      - name: Detect missing migrations
        run: python manage.py makemigrations --check --dry-run
