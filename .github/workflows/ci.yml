name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Frontend tests
        run: npm test

      - name: Validate application security configuration
        run: npm run security:check

      - name: Build production frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SIGNUP_API_URL: ${{ vars.VITE_SIGNUP_API_URL }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-rider-frontend-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Django tests and migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Verify linear relay migration graph and forward/backward behavior
        run: |
          rm -f db.sqlite3
          python manage.py migrate relay 0003 --noinput
          python manage.py migrate relay 0004 --noinput
          python manage.py migrate relay 0005_green_wallet_ledger_and_policy --noinput
          python manage.py migrate relay 0006_institutional_vertical_slice --noinput
          python manage.py migrate relay 0005_green_wallet_ledger_and_policy --noinput
          python manage.py migrate relay 0006_institutional_vertical_slice --noinput
          python manage.py migrate --noinput
          python manage.py showmigrations relay

      - name: Django system checks
        run: python manage.py check

      - name: Detect missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Backend tests
        run: python manage.py test

  postgres-integration:
    name: Canonical PostgreSQL + Rule 2202 vertical slice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_ci_password
          POSTGRES_DB: relay_rider_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_rider_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://relay:relay_ci_password@127.0.0.1:5432/relay_rider_ci?sslmode=disable
      DJANGO_DB_SCHEMA: relay_app
      DJANGO_DEBUG: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Create canonical Django schema
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              conn.execute('create schema if not exists relay_app')
          PY

      - name: Apply Django migrations to canonical schema
        run: python manage.py migrate --noinput

      - name: Install and verify Rule 2202 functions
        run: python manage.py install_rule2202_functions

      - name: Run fictional institutional vertical slice
        shell: bash
        run: |
          set -euo pipefail
          output="$(python manage.py run_fictional_vertical_slice)"
          printf '%s\n' "$output"
          grep -q 'Rule 2202 status=completed' <<< "$output"

      - name: Verify Django tables are isolated from public schema
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute("select to_regclass('relay_app.relay_institution'), to_regclass('public.relay_institution')")
              canonical, public_copy = cursor.fetchone()
          if canonical is None or public_copy is not None:
              raise SystemExit(f'Unexpected schema placement: relay_app={canonical}, public={public_copy}')
          print(f'Canonical Django table verified at {canonical}; no public duplicate exists.')
          PY

      - name: Verify canonical PostgreSQL system state
        run: python manage.py check
