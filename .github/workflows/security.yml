name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm run security:check

      - name: Scan tracked files for common credential patterns
        shell: bash
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9_-]{20,}|pat[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'; then
            echo "Potential credential material found in tracked files."
            exit 1
          fi
