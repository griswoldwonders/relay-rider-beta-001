name: Operational hardening gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-cycle:
    name: Migration 0007 forward backward reapply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Verify 0007 forward backward and reapply
        run: |
          rm -f db.sqlite3
          python manage.py migrate relay 0006_institutional_vertical_slice --noinput
          python manage.py migrate relay 0007_operational_beta_hardening --noinput
          python manage.py migrate relay 0006_institutional_vertical_slice --noinput
          python manage.py migrate relay 0007_operational_beta_hardening --noinput
          python manage.py migrate --noinput
          python manage.py showmigrations relay
          python manage.py makemigrations --check --dry-run
