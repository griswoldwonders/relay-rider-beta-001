name: Pandera validation branch check

on:
  pull_request:
    branches: [codex/institutional-vertical-slice]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-pandera:
    name: Canonical commute import validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run canonical commute import tests
        run: python manage.py test relay.test_vertical_slice.VerticalSliceTestCase
