name: Production PostgreSQL migration and verification

on:
  workflow_dispatch:
    inputs:
      run_synthetic_vertical_slice:
        description: 'Run the fictional institutional vertical slice after migration (writes synthetic records)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-postgres-migration
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    name: Migrate canonical relay_app schema and verify Rule 2202
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DATABASE_URL: ${{ secrets.RELAY_RIDER_DATABASE_URL }}
      DJANGO_DB_SCHEMA: relay_app
      DJANGO_DEBUG: 'false'
      DJANGO_SECRET_KEY: ${{ secrets.RELAY_RIDER_DJANGO_SECRET_KEY }}
      DJANGO_ALLOWED_HOSTS: ${{ vars.RELAY_RIDER_DJANGO_ALLOWED_HOSTS }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require production database secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo 'RELAY_RIDER_DATABASE_URL is not configured in the protected production environment.' >&2
            exit 1
          fi
          if [[ -z "${DJANGO_SECRET_KEY:-}" ]]; then
            echo 'RELAY_RIDER_DJANGO_SECRET_KEY is not configured in the protected production environment.' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Verify database target before writes
        run: |
          python - <<'PY'
          import os
          import psycopg
          from urllib.parse import urlparse
          parsed = urlparse(os.environ['DATABASE_URL'])
          print(f'PostgreSQL target host: {parsed.hostname}; database: {parsed.path.lstrip("/")}; schema: relay_app')
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              row = conn.execute("select current_database(), current_user, to_regnamespace('relay_app')").fetchone()
          if row[2] is None:
              raise SystemExit('relay_app schema is missing; refusing to migrate an unexpected database target')
          print('Canonical relay_app schema found; target verification passed.')
          PY

      - name: Preview Django migration plan
        run: python manage.py migrate --plan

      - name: Apply Django migrations to relay_app
        run: python manage.py migrate --noinput

      - name: Verify deployed Rule 2202 functions
        run: python manage.py install_rule2202_functions --verify-only

      - name: Verify canonical schema placement
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          import django
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute("select to_regclass('relay_app.relay_institution'), to_regclass('public.relay_institution')")
              canonical, public_copy = cursor.fetchone()
          if canonical is None or public_copy is not None:
              raise SystemExit(f'Unexpected schema placement: relay_app={canonical}, public={public_copy}')
          print(f'Canonical Django table verified at {canonical}; no public duplicate exists.')
          PY

      - name: Run fictional institutional vertical slice
        if: ${{ inputs.run_synthetic_vertical_slice }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(python manage.py run_fictional_vertical_slice)"
          printf '%s\n' "$output"
          grep -q 'Rule 2202 status=completed' <<< "$output"

      - name: Final Django system check
        run: python manage.py check
