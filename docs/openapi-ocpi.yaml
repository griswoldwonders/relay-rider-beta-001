openapi: 3.1.0
info:
  title: Relay Rider OCPI and EV Charge Credit API
  version: 0.1.0
  description: |
    API contract for OCPI Session and CDR ingestion plus Relay Rider's
    EV Charge Credit redemption and settlement endpoints. EV Charge Credit
    is a non-monetary program incentive and is not a payment instrument or
    certified environmental credit.
servers:
  - url: https://api.relayrider.example
    description: Production placeholder
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Redemptions
  - name: Charging Sessions
  - name: CDRs
  - name: OCPI Integration
paths:
  /api/charging/locations:
    get:
      tags: [Redemptions]
      summary: Search eligible charging locations
      parameters:
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - name: radiusKm
          in: query
          schema: { type: number, minimum: 0, maximum: 250, default: 25 }
        - name: connector
          in: query
          schema: { type: string }
        - name: partner
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Eligible locations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeLocationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/charging/locations/{locationId}:
    get:
      tags: [Redemptions]
      summary: Get a normalized location and tariff snapshot
      parameters:
        - $ref: '#/components/parameters/LocationId'
      responses:
        '200':
          description: Location
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeLocation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/redemptions/quote:
    post:
      tags: [Redemptions]
      summary: Quote the covered portion of a prospective charging session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedemptionQuoteRequest' }
      responses:
        '200':
          description: Redemption quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeRedemptionQuote' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/redemptions:
    post:
      tags: [Redemptions]
      summary: Create an idempotent redemption request and place a credit hold
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRedemptionRequest' }
      responses:
        '201':
          description: Redemption created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeRedemption' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/redemptions/{redemptionId}:
    get:
      tags: [Redemptions]
      summary: Get redemption status
      parameters:
        - $ref: '#/components/parameters/RedemptionId'
      responses:
        '200':
          description: Redemption
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeRedemption' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/redemptions/{redemptionId}/approve:
    post:
      tags: [Redemptions]
      summary: Approve a redemption request
      parameters:
        - $ref: '#/components/parameters/RedemptionId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: Approved redemption
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeRedemption' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/redemptions/{redemptionId}/deny:
    post:
      tags: [Redemptions]
      summary: Deny a redemption request and release its hold
      parameters:
        - $ref: '#/components/parameters/RedemptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: Denied redemption
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeRedemption' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/redemptions/{redemptionId}/authorize:
    post:
      tags: [Redemptions]
      summary: Publish a token and request remote session authorization
      parameters:
        - $ref: '#/components/parameters/RedemptionId'
      responses:
        '202':
          description: Authorization pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAuthorization' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/charging-sessions/{sessionId}:
    get:
      tags: [Charging Sessions]
      summary: Get a normalized charging session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Charging session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeSession' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/charging-sessions/{sessionId}/stop:
    post:
      tags: [Charging Sessions]
      summary: Request that an authorized session stop
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '202':
          description: Stop command accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeCommandResult' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/integrations/{partnerId}/ocpi/sessions:
    put:
      tags: [OCPI Integration]
      summary: Receive a new or replacement OCPI Session
      security: [{ ocpiTokenAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PartnerId'
        - $ref: '#/components/parameters/CountryCode'
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OcpiSession' }
      responses:
        '200':
          description: Session accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [OCPI Integration]
      summary: Receive a partial OCPI Session update
      security: [{ ocpiTokenAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PartnerId'
        - $ref: '#/components/parameters/CountryCode'
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OcpiSessionPatch' }
      responses:
        '200':
          description: Session patched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeSession' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/integrations/{partnerId}/ocpi/sessions/{countryCode}/{partyId}/{sessionId}:
    get:
      tags: [OCPI Integration]
      summary: Return a stored OCPI Session to a CPO
      security: [{ ocpiTokenAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PartnerId'
        - $ref: '#/components/parameters/CountryCode'
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/integrations/{partnerId}/ocpi/cdrs:
    post:
      tags: [OCPI Integration]
      summary: Receive an immutable OCPI CDR
      security: [{ ocpiTokenAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PartnerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OcpiCdr' }
      responses:
        '200':
          description: Duplicate or matched CDR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeCdrReceipt' }
        '202':
          description: CDR accepted for review or asynchronous settlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeCdrReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/integrations/{partnerId}/ocpi/cdrs/{countryCode}/{partyId}/{cdrId}:
    get:
      tags: [OCPI Integration]
      summary: Return a stored OCPI CDR
      security: [{ ocpiTokenAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PartnerId'
        - $ref: '#/components/parameters/CountryCode'
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/CdrId'
      responses:
        '200':
          description: CDR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeCdr' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/ocpi/sessions/:
    post:
      tags: [OCPI Integration]
      summary: Internal ingestion of a normalized OCPI Session
      description: |
        Authenticated, service-to-service internal boundary -- NOT
        participant-facing. Intended to be called by an OCPI connector
        worker/service that has already authenticated the inbound
        provider call (token/mTLS) at the transport layer; this
        endpoint additionally requires an authenticated Relay Rider
        admin/service account (`IsAdminUser`), never `AllowAny`, and is
        the one explicit override of this API's global permissive
        default. See relay/ocpi/views.py and
        docs/OCPI_PRODUCTION_SECURITY_AND_SESSION_LINKING.md.

        The request body is the normalized OCPI Session object plus an
        internal `partner_id` used to resolve which OcpiProvider/tenant
        the session belongs to (`partner_id` is not part of the OCPI
        Session object itself). Never exposes provider credentials,
        mTLS certificate/key material, or the raw upstream payload in
        the response.
      security: [{ internalAdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalOcpiSessionIngest' }
      responses:
        '200':
          description: Session created or updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeInternalSessionIngestResult' }
        '400':
          description: Invalid or malformed Session payload; no state is persisted
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Authenticated but not an admin/service account
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: The matched Session is already COMPLETED and cannot be reopened
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /api/internal/ocpi/cdrs/:
    post:
      tags: [OCPI Integration]
      summary: Internal ingestion and settlement of a normalized OCPI CDR
      description: |
        Authenticated, service-to-service internal boundary -- NOT
        participant-facing; requires `IsAdminUser` (see the
        `/api/internal/ocpi/sessions/` description above for the
        authorization rationale, which applies identically here).

        Matches the CDR to at most one Green Wallet redemption
        (precedence: authorization_reference, then session_id, then
        cdr_token.uid, always scoped to the resolved provider/tenant),
        then either posts a single append-only DEBIT
        WalletLedgerEntry (`SETTLED`) or leaves the CDR for manual
        review (`REVIEW_REQUIRED`) -- it never partially settles or
        guesses a match. "Settlement" here is an internal, capped,
        non-monetary program-credit ledger entry, not a certified
        carbon credit or a payment instrument.

        Idempotent by (provider, cdr_id): redelivering the exact same
        CDR returns `DUPLICATE` with the original settlement outcome
        and never creates a second ledger entry or mutates the
        original CDR row, even under concurrent/simultaneous delivery
        (enforced by a `select_for_update` lock plus a database unique
        constraint as a backstop). A credit CDR (`credit: true`)
        reverses a previously settled CDR via `credit_reference_id` by
        creating a brand-new CDR row and, if eligible, a brand-new
        REVERSAL ledger entry -- it never edits the original CDR or
        DEBIT entry.
      security: [{ internalAdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalOcpiCdrIngest' }
      responses:
        '200':
          description: CDR settled (matched) or a duplicate of a previously processed CDR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeInternalCdrIngestResult' }
        '202':
          description: CDR accepted and stored, but requires manual review (no unambiguous match, insufficient units, denied redemption, etc.)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeInternalCdrIngestResult' }
        '400':
          description: Invalid or malformed CDR payload -- e.g. missing required fields or wrong field types; no CDR or ledger row is persisted
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Authenticated but not an admin/service account
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ocpiTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'OCPI credentials token in the form: Token <provider-token>. Use mTLS in addition when required by the partner.'
    internalAdminAuth:
      type: http
      scheme: basic
      description: |
        Internal, service-to-service/admin-only authentication for the
        /api/internal/ocpi/* boundary (Django `IsAdminUser`, i.e. an
        authenticated staff/service account). This is never
        participant-facing and never accepts an unauthenticated or
        non-admin caller -- see relay/ocpi/views.py.
  parameters:
    PartnerId: { name: partnerId, in: path, required: true, schema: { type: string } }
    CountryCode: { name: countryCode, in: path, required: true, schema: { type: string, pattern: '^[A-Z]{2}$' } }
    PartyId: { name: partyId, in: path, required: true, schema: { type: string, pattern: '^[A-Z0-9]{3}$' } }
    LocationId: { name: locationId, in: path, required: true, schema: { type: string } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, maxLength: 36 } }
    CdrId: { name: cdrId, in: path, required: true, schema: { type: string, maxLength: 39 } }
    RedemptionId: { name: redemptionId, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    Latitude: { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
    Longitude: { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
  responses:
    BadRequest:
      description: Invalid request or OCPI object
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: Missing or invalid credentials
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Invalid state transition or duplicate active redemption
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    Envelope:
      type: object
      required: [status_code, status_message, data]
      properties:
        status_code: { type: integer, example: 1000 }
        status_message: { type: string, example: Success }
        data: {}
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties: { status_code: { type: integer, example: 2000 }, data: { nullable: true } }
    EnvelopeLocationList:
      allOf: [{ $ref: '#/components/schemas/Envelope' }]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Location' } } }
    EnvelopeLocation:
      allOf: [{ $ref: '#/components/schemas/Envelope' }]
      properties: { data: { $ref: '#/components/schemas/Location' } }
    EnvelopeRedemption:
      allOf: [{ $ref: '#/components/schemas/Envelope' }]
      properties: { data: { $ref: '#/components/schemas/Redemption' } }
    EnvelopeRedemptionQuote:
      allOf: [{ $ref: '#/components/schemas/Envelope' }]
      properties: { data: { $ref: '#/components/schemas/RedemptionQuote' } }
    EnvelopeAuthorization:
      allOf: [{ $ref: '#/components/schemas/Envelope' }]
      properties: { data: { $ref: '#/components/schemas/Authorization' } }
    EnvelopeSession:
      allOf: [{ $ref: '#/components/schemas/Envelope' }]
      properties: { data: { $ref: '#/components/schemas/OcpiSession' } }
    EnvelopeCdr:
      allOf: [{ $ref: '#/components/schemas/Envelope' }]
      properties: { data: { $ref: '#/components/schemas/OcpiCdr' } }
    EnvelopeCdrReceipt:
      allOf: [{ $ref: '#/components/schemas/Envelope' }]
      properties:
        data:
          type: object
          required: [cdr_id, matched, status]
          properties:
            cdr_id: { type: string }
            matched: { type: boolean }
            status: { type: string, enum: [SETTLED, REVIEW_REQUIRED, DUPLICATE] }
    EnvelopeCommandResult:
      allOf: [{ $ref: '#/components/schemas/Envelope' }]
      properties: { data: { type: object, properties: { command_id: { type: string }, status: { type: string } } } }
    RedemptionQuoteRequest:
      type: object
      required: [creditId, locationId, unitType]
      properties:
        creditId: { type: string }
        locationId: { type: string }
        unitType: { type: string, enum: [KWH, USD_SUBSIDY, SESSION] }
        requestedKwh: { type: number, minimum: 0 }
    CreateRedemptionRequest:
      type: object
      required: [creditId, locationId, mode]
      properties:
        creditId: { type: string }
        locationId: { type: string }
        mode: { type: string, enum: [PARTNER_AUTHORIZED, PAY_AND_REIMBURSE] }
        authorizationReference: { type: string, maxLength: 36 }
    ReviewRequest:
      type: object
      properties:
        note: { type: string, maxLength: 2000 }
    Redemption:
      type: object
      required: [id, creditId, participantId, locationId, status, mode, requestedAt]
      properties:
        id: { type: string }
        creditId: { type: string }
        participantId: { type: string }
        locationId: { type: string }
        status: { type: string, enum: [REDEMPTION_REQUESTED, APPROVED, CREDIT_HELD, TOKEN_PUBLISHED, AUTHORIZATION_PENDING, SESSION_ACTIVE, SESSION_COMPLETED, CDR_RECEIVED, SETTLED, DENIED, EXPIRED, REVIEW_REQUIRED, DISPUTED] }
        mode: { type: string, enum: [PARTNER_AUTHORIZED, PAY_AND_REIMBURSE] }
        authorizationReference: { type: string }
        tokenUid: { type: string }
        requestedAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewNote: { type: string, nullable: true }
    RedemptionQuote:
      type: object
      required: [creditId, locationId, coveredAmount, participantOverage, eligible]
      properties:
        creditId: { type: string }
        locationId: { type: string }
        coveredAmount: { type: number, minimum: 0 }
        participantOverage: { type: number, minimum: 0 }
        eligible: { type: boolean }
        reason: { type: string }
    Authorization:
      type: object
      required: [redemptionId, status, expiresAt]
      properties:
        redemptionId: { type: string }
        tokenUid: { type: string }
        authorizationReference: { type: string }
        status: { type: string, enum: [ACCEPTED, REJECTED, PENDING, TIMEOUT] }
        expiresAt: { type: string, format: date-time }
    CdrToken:
      type: object
      required: [uid, type, contract_id]
      properties:
        uid: { type: string, maxLength: 36 }
        type: { type: string }
        contract_id: { type: string, maxLength: 36 }
    CdrLocation:
      type: object
      required: [id, name, address, city, country, evse_uid, connector_id]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        postal_code: { type: string }
        country: { type: string, minLength: 3, maxLength: 3 }
        evse_uid: { type: string }
        connector_id: { type: string }
    OcpiSession:
      type: object
      required: [country_code, party_id, id, start_date_time, kwh, cdr_token, auth_method, location_id, evse_uid, connector_id, currency, status, last_updated]
      properties:
        country_code: { type: string, pattern: '^[A-Z]{2}$' }
        party_id: { type: string, pattern: '^[A-Z0-9]{3}$' }
        id: { type: string, maxLength: 36 }
        start_date_time: { type: string, format: date-time }
        end_date_time: { type: string, format: date-time, nullable: true }
        kwh: { type: number, minimum: 0 }
        cdr_token: { $ref: '#/components/schemas/CdrToken' }
        auth_method: { type: string, enum: [AUTH_REQUEST, COMMAND, WHITELIST, DEBIT] }
        authorization_reference: { type: string, maxLength: 36 }
        location_id: { type: string, maxLength: 36 }
        evse_uid: { type: string, maxLength: 36 }
        connector_id: { type: string, maxLength: 36 }
        meter_id: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        charging_periods: { type: array, items: { $ref: '#/components/schemas/ChargingPeriod' } }
        total_cost: { $ref: '#/components/schemas/Price' }
        status: { type: string, enum: [PENDING, ACTIVE, RESERVED, COMPLETED, INVALID] }
        last_updated: { type: string, format: date-time }
    OcpiSessionPatch:
      type: object
      required: [last_updated]
      properties:
        end_date_time: { type: string, format: date-time }
        kwh: { type: number, minimum: 0 }
        charging_periods: { type: array, items: { $ref: '#/components/schemas/ChargingPeriod' } }
        total_cost: { $ref: '#/components/schemas/Price' }
        status: { type: string, enum: [PENDING, ACTIVE, RESERVED, COMPLETED, INVALID] }
        last_updated: { type: string, format: date-time }
    OcpiCdr:
      type: object
      required: [country_code, party_id, id, start_date_time, end_date_time, cdr_token, auth_method, cdr_location, total_energy, total_time, total_cost]
      properties:
        country_code: { type: string, pattern: '^[A-Z]{2}$' }
        party_id: { type: string, pattern: '^[A-Z0-9]{3}$' }
        id: { type: string, maxLength: 39 }
        start_date_time: { type: string, format: date-time }
        end_date_time: { type: string, format: date-time }
        session_id: { type: string, maxLength: 36 }
        cdr_token: { $ref: '#/components/schemas/CdrToken' }
        auth_method: { type: string, enum: [AUTH_REQUEST, COMMAND, WHITELIST, DEBIT] }
        authorization_reference: { type: string, maxLength: 36 }
        cdr_location: { $ref: '#/components/schemas/CdrLocation' }
        meter_id: { type: string }
        total_energy: { type: number, minimum: 0 }
        total_time: { type: number, minimum: 0 }
        total_parking_time: { type: number, minimum: 0 }
        total_cost: { $ref: '#/components/schemas/Price' }
        charging_periods: { type: array, items: { $ref: '#/components/schemas/ChargingPeriod' } }
        credit: { type: boolean }
        credit_reference_id: { type: string, maxLength: 39 }
        last_updated: { type: string, format: date-time }
    InternalOcpiSessionIngest:
      allOf:
        - $ref: '#/components/schemas/OcpiSession'
        - type: object
          required: [partner_id]
          properties:
            partner_id:
              type: string
              maxLength: 64
              description: Internal tenant-scoping key resolved to an OcpiProvider; not part of the OCPI Session object itself.
    InternalOcpiCdrIngest:
      allOf:
        - $ref: '#/components/schemas/OcpiCdr'
        - type: object
          required: [partner_id]
          properties:
            partner_id:
              type: string
              maxLength: 64
              description: Internal tenant-scoping key resolved to an OcpiProvider; not part of the OCPI CDR object itself.
    EnvelopeInternalSessionIngestResult:
      allOf: [{ $ref: '#/components/schemas/Envelope' }]
      properties:
        data:
          type: object
          required: [id, status, ingestion_status]
          properties:
            id: { type: string, description: The OCPI Session id (external_session_id). }
            status: { type: string, enum: [PENDING, ACTIVE, RESERVED, COMPLETED, INVALID] }
            ingestion_status:
              type: string
              enum: [created, updated]
              description: Whether this call created a new Session projection or updated an existing one.
    EnvelopeInternalCdrIngestResult:
      allOf: [{ $ref: '#/components/schemas/Envelope' }]
      properties:
        data:
          type: object
          required: [cdr_id, matched, status]
          properties:
            cdr_id: { type: string }
            matched:
              type: boolean
              description: True only when this delivery resulted in a settled DEBIT/REVERSAL ledger entry.
            status:
              type: string
              enum: [SETTLED, REVIEW_REQUIRED, DUPLICATE]
              description: |
                SETTLED: a ledger entry was posted (first delivery only).
                REVIEW_REQUIRED: stored for manual review; no ledger entry (no unambiguous match, insufficient units, denied redemption, provider mismatch, or unknown reversal target).
                DUPLICATE: same (provider, cdr_id) as a previously processed CDR; returns the original outcome and never mutates state.
    Price:
      type: object
      required: [excl_vat, currency]
      properties:
        excl_vat: { type: number, minimum: 0 }
        incl_vat: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
    ChargingPeriod:
      type: object
      required: [start_date_time, dimensions]
      properties:
        start_date_time: { type: string, format: date-time }
        tariff_id: { type: string, maxLength: 36 }
        dimensions:
          type: array
          items:
            type: object
            required: [type, volume]
            properties:
              type: { type: string, enum: [ENERGY, FLAT, PARKING_TIME, TIME, MAX_CURRENT, MIN_CURRENT, MAX_POWER, MIN_POWER] }
              volume: { type: number, minimum: 0 }
    Location:
      type: object
      required: [id, name, address, city, country, evses]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        postalCode: { type: string }
        country: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        status: { type: string }
        eligibleModes: { type: array, items: { type: string } }
        evses: { type: array, items: { type: object } }
